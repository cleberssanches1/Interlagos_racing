    name: car_pos_x
    addr: 0x060F1000
    width: 4
    type: float32
    cpu_mask: [MSH2]
    sample_mode: on_change

  - id: 101
    name: car_pos_z
    addr: 0x060F1004
    width: 4
    type: float32
    cpu_mask: [MSH2]
    sample_mode: on_change

  - id: 104
    name: car_yaw_rad
    addr: 0x060F1028
    width: 4
    type: float32
    cpu_mask: [MSH2]
    sample_mode: every_frame

  - id: 105
    name: steering_input
    addr: 0x060F1100
    width: 2
    type: int16
    cpu_mask: [MSH2]
    sample_mode: every_frame

  - id: 106
    name: throttle_input
    addr: 0x060F1102
    width: 2
    type: int16
    cpu_mask: [MSH2]
    sample_mode: every_frame

  - id: 107
    name: brake_input
    addr: 0x060F1104
    width: 2
    type: int16
    cpu_mask: [MSH2]
    sample_mode: every_frame
